{# Donor directory export and print actions; also updated out-of-band on HTMX filter changes. #}
<div id="donor-export-actions"{% if oob %} hx-swap-oob="outerHTML"{% endif %} class="flex flex-wrap items-center gap-2">
  <a href="{{ csv_url }}"
     class="inline-flex items-center gap-1.5 rounded-lg border border-ink-200 bg-white px-3.5 py-2 text-sm font-medium text-ink-700 transition hover:bg-ink-50">
    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
    CSV

</div>
