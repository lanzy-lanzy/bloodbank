{# Generic empty state. Pass: empty_title, empty_text, optional empty_icon #}
<div class="flex flex-col items-center justify-center py-16 text-center">
  <div class="w-16 h-16 rounded-2xl bg-ink-100 flex items-center justify-center mb-4">
    <svg class="w-8 h-8 text-ink-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7m16 0v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-5m16 0h-2.586a1 1 0 0 0-.707.293l-2.414 2.414a1 1 0 0 1-.707.293h-3.172a1 1 0 0 1-.707-.293l-2.414-2.414A1 1 0 0 0 6.586 13H4"/>
    </svg>
  </div>
  <h3 class="text-base font-semibold text-ink-700">{{ empty_title|default:"No records found" }}</h3>
  <p class="text-sm text-ink-500 mt-1 max-w-sm">{{ empty_text|default:"Nothing to show here yet." }}</p>
  {% block empty_action %}{% endblock %}
</div>
