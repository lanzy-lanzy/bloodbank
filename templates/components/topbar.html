{% load core_extras %}
<header class="fixed top-0 right-0 left-0 lg:left-64 z-40 h-16 bg-white/85 backdrop-blur-md border-b border-ink-200/70 shadow-sm flex items-center gap-3 px-4 sm:px-6">
  <button @click="sidebarOpen = !sidebarOpen" class="lg:hidden p-2 rounded-lg hover:bg-ink-100 text-ink-600" aria-label="Toggle navigation">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a href="{% url 'core:dashboard' %}" class="min-w-0 flex items-center" aria-label="Back to dashboard">
    <span class="font-bold text-ink-900 text-lg truncate">{% section_title request %}</span>
  </a>
  <div class="flex-1"></div>
  <span hx-get="{% url 'notifications:inbox_badge' %}" hx-trigger="load, every 60s" hx-target="#notif-badge-slot" hx-swap="innerHTML" id="notif-badge-slot" class="relative"></span>
  <div x-data="{ open: false }" class="relative">
    <button @click="open = !open" class="flex items-center gap-2 p-1.5 rounded-xl hover:bg-ink-100" aria-haspopup="menu" :aria-expanded="open">
      <span class="w-8 h-8 rounded-lg bg-ink-800 text-white flex items-center justify-center text-sm font-semibold">
        {{ user.get_initials|default:"U" }}
      </span>
      <span class="hidden md:block text-left leading-tight">
        <span class="block text-sm font-semibold text-ink-800">{{ user.get_full_name|default:user.username }}</span>
        <span class="block text-[11px] text-ink-500 uppercase tracking-wide">{{ user.get_role_display }}</span>
      </span>
      <svg class="w-4 h-4 text-ink-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="m6 9 6 6 6-6"/></svg>
    </button>
    <div x-show="open" x-cloak @click.outside="open = false" x-transition
         class="absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-ink-200 py-1.5 z-50">
      <a href="{% url 'accounts:profile' %}" hx-get="{% url 'accounts:profile' %}" hx-target="#modal-root" hx-swap="innerHTML"
         class="flex items-center gap-2 px-4 py-2 text-sm text-ink-700 hover:bg-ink-50">
        <svg class="w-4 h-4 text-ink-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        My Profile</a>
      <a href="{% url 'accounts:password_change' %}" hx-get="{% url 'accounts:password_change' %}" hx-target="#modal-root" hx-swap="innerHTML"
         class="flex items-center gap-2 px-4 py-2 text-sm text-ink-700 hover:bg-ink-50">
        <svg class="w-4 h-4 text-ink-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Change Password</a>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit" class="w-full flex items-center gap-2 px-4 py-2 text-sm text-brand-700 hover:bg-brand-50">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9"/></svg>
          Sign out</button>
      </form>
    </div>
  </div>
</header>
