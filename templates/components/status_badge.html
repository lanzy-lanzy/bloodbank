{% load core_extras %}
{# Status badge: include it with status=obj.status. #}
{% with color=status|status_color %}
<span class="inline-flex items-center gap-1.5 rounded-md px-2.5 py-0.5 text-[11px] font-semibold tracking-wide border
  {% if color == 'green' %}bg-emerald-50 text-emerald-800 border-emerald-200/90
  {% elif color == 'red' %}bg-brand-50 text-brand-800 border-brand-200/90
  {% elif color == 'amber' %}bg-amber-50 text-amber-800 border-amber-200/90
  {% elif color == 'sky' %}bg-sky-50 text-sky-800 border-sky-200/90
  {% elif color == 'violet' %}bg-violet-50 text-violet-800 border-violet-200/90
  {% else %}bg-ink-100 text-ink-700 border-ink-200{% endif %}">
  <span class="w-1.5 h-1.5 rounded-full
    {% if color == 'green' %}bg-emerald-600
    {% elif color == 'red' %}bg-brand-600
    {% elif color == 'amber' %}bg-amber-600
    {% elif color == 'sky' %}bg-sky-600
    {% elif color == 'violet' %}bg-violet-600
    {% else %}bg-ink-500{% endif %}" aria-hidden="true"></span>
  {{ status|display_status }}
</span>
{% endwith %}
