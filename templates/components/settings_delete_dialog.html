<dialog x-data="{ open: false, title: '', text: '', url: '' }"
        @bb-confirm-delete.window="open = true; title = $event.detail.title; text = $event.detail.text; url = $event.detail.url"
        x-effect="open ? $el.showModal() : $el.close()"
        @cancel.prevent="open = false" @click.self="open = false"
        class="bb-dialog w-full max-w-md" aria-labelledby="settings-delete-title">
  <div class="bb-dialog-confirmation">
    <div class="bb-dialog-confirm-body">
      <div class="flex items-start gap-3.5">
        <span class="w-10 h-10 rounded-lg bg-brand-50 border border-brand-200 text-brand-700 flex items-center justify-center shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>
        </span>
        <div class="min-w-0">
          <h3 id="settings-delete-title" class="text-base font-semibold text-ink-900" x-text="title">Delete?</h3>
          <p class="text-sm text-ink-500 mt-1.5 leading-relaxed" x-text="text"></p>
        </div>
      </div>
    </div>
    <div class="bb-dialog-actions">
      <button type="button" autofocus @click="open = false" class="px-4 py-2 text-sm font-medium rounded-lg border border-ink-300 bg-white hover:bg-ink-50 text-ink-700">Cancel</button>
      <form method="post" :action="url" @submit.prevent="open = false; $el.submit()">
        {% csrf_token %}
        <button type="submit" class="px-4 py-2 text-sm font-semibold rounded-lg bg-brand-600 text-white hover:bg-brand-700 shadow-xs">Delete</button>
      </form>
    </div>
  </div>
</dialog>
