{# Stat card for dashboards. Pass: stat_label, stat_value, stat_sub, stat_color (rose|emerald|amber|sky|violet|slate), stat_href, stat_icon #}
<a href="{{ stat_href|default:'#' }}" {% if not stat_href %}onclick="return false;"{% endif %}
   class="bb-stat block rounded-2xl border border-ink-200/80 p-5"
   data-accent="{{ stat_color|default:'rose' }}">
  <div class="flex items-start justify-between gap-3">
    <p class="text-xs font-semibold uppercase tracking-wide text-ink-500">{{ stat_label }}</p>
    {% if stat_icon %}<span class="bb-stat-icon w-9 h-9 rounded-xl flex items-center justify-center">{{ stat_icon }}</span>{% endif %}
  </div>
  <p class="mt-2 text-3xl font-bold text-ink-900 tabular-nums">{{ stat_value }}</p>
  {% if stat_sub %}<p class="mt-1 text-xs text-ink-500">{{ stat_sub }}</p>{% endif %}
</a>
