{# Unread count for the topbar bell. The bell itself lives in the topbar template (it carries the htmx wiring); this fragment is the count pill only, polled every 60 seconds. #}
{% if count %}
<span class="bb-count-pill absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-brand-600 text-white text-[10px] font-bold flex items-center justify-center">{% if count > 99 %}99+{% else %}{{ count }}{% endif %}</span>
{% endif %}
