<!DOCTYPE html>
{% load static core_extras %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ error_code }} — {{ error_title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{% static_v 'css/tailwind.css' %}">
</head>
<body class="min-h-screen bg-ink-950 flex items-center justify-center p-6 text-ink-200 antialiased">
  <div class="text-center max-w-md rounded-xl border border-white/10 bg-white/[0.03] px-8 py-10">
    <p class="text-6xl font-bold tracking-tight text-brand-400 tabular-nums">{{ error_code }}</p>
    <h1 class="mt-4 text-xl font-semibold text-white">{{ error_title }}</h1>
    <p class="mt-2 text-ink-400 text-sm leading-relaxed">{{ error_message }}</p>
    <a href="/" class="mt-8 inline-block px-5 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold transition">Back to Dashboard</a>
  </div>
</body>
</html>
