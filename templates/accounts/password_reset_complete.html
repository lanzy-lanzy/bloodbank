{% extends "base_auth.html" %}
{% block title %}Password Updated — {{ ORG_NAME }}{% endblock %}
{% block auth_content %}
<h2 class="text-lg font-bold text-ink-900 mb-2">Password updated</h2>
<p class="text-sm text-ink-500 mb-4">You can now sign in with your new password.</p>
<a href="{% url 'accounts:login' %}" class="block w-full text-center rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold py-2.5">Sign in</a>
{% endblock %}
