{% extends "base.html" %}
{% load core_extras %}
{% block title %}Registrations — {{ ORG_NAME }}{% endblock %}
{% block content %}
<div class="flex flex-wrap items-center justify-between gap-3 mb-6">
  <div>
    <h1 class="text-2xl font-bold text-ink-900">Registrations</h1>
    <p class="text-sm text-ink-500 mt-0.5">Review donor / requester self-registration requests.</p>
  </div>
</div>

<div class="bg-white rounded-2xl border border-ink-200 shadow-sm p-4 mb-4">
  <form method="get" action="{% url 'accounts:registration_list' %}"
        hx-get="{% url 'accounts:registration_list' %}" hx-target="#results" hx-push-url="true"
        hx-trigger="change, keyup changed delay:300ms from:input[name=q]"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
    <input type="search" name="q" value="{{ q }}" placeholder="Name, username, email…"
           class="rounded-xl border-ink-300 border px-3 py-2 text-sm focus:border-brand-500 focus:ring-brand-500 lg:col-span-2">
    <select name="status" class="rounded-xl border-ink-300 border px-3 py-2 text-sm focus:border-brand-500 focus:ring-brand-500">
      <option value="">Any status</option>
      {% for value, label in statuses %}
        <option value="{{ value }}" {% if status_filter == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    <select name="role" class="rounded-xl border-ink-300 border px-3 py-2 text-sm focus:border-brand-500 focus:ring-brand-500">
      <option value="">Any role</option>
      {% for value, label in roles %}
        <option value="{{ value }}" {% if role_filter == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </form>
</div>

<div id="results">
  {% include "accounts/_registration_table.html" %}
</div>
{% endblock %}
